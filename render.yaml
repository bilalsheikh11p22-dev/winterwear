# Render.com deployment manifest for WinterWear backend
# Docs: https://render.com/docs/render-yaml

services:
  - type: web
    name: winterwear-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/server.js
    plan: starter  # Upgrade to standard for production traffic

    # Health check — Render probes this path after each deploy
    healthCheckPath: /api/ready

    # Auto-deploy on push to main
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000  # Render assigns PORT automatically; keep this as fallback

      # ── Set these in Render dashboard (never commit real values) ──────────────

      - key: MONGODB_URI
        sync: false  # Mark as secret — set in Render dashboard

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: CORS_ORIGIN
        sync: false  # e.g. https://winterwear.pk

      - key: CLIENT_URL
        sync: false  # e.g. https://winterwear.pk

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: PAYMENT_SUCCESS_URL
        sync: false  # e.g. https://winterwear.pk/checkout/success

      - key: PAYMENT_CANCEL_URL
        sync: false  # e.g. https://winterwear.pk/checkout/cancelled

      - key: SMTP_HOST
        sync: false

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: EMAIL_FROM
        sync: false

      - key: ENABLE_CASH_ON_DELIVERY
        value: 'true'

      - key: DEFAULT_CURRENCY
        value: PKR

      - key: FREE_SHIPPING_THRESHOLD_PKR
        value: '5000'

      - key: FLAT_SHIPPING_FEE_PKR
        value: '250'

      - key: RESERVATION_EXPIRY_MINUTES
        value: '30'
